name: ai_video_player_next
description: Local-first video player foundation with replaceable speech and translation providers.
publish_to: "none"
version: 0.10.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  flutter_riverpod: ^2.5.1
  file_selector: ^1.0.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.9
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.0
  webview_windows: ^0.4.0
  path_provider: ^2.1.4
  crypto: ^3.0.3
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
