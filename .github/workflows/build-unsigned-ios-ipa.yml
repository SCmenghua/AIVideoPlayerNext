name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: Bundle Identifier embedded in the unsigned IPA (leave the default unless your sideloading tool requires another value)
        required: false
        default: com.scmenghua.aivideoplayernext
        type: string

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare pinned whisper.cpp source
        env:
          WHISPER_CPP_COMMIT: a8d002cfd879315632a579e73f0148d06959de36
        run: |
          whisper_dir="$RUNNER_TEMP/whisper.cpp"
          git init "$whisper_dir"
          git -C "$whisper_dir" remote add origin https://github.com/ggerganov/whisper.cpp.git
          git -C "$whisper_dir" fetch --depth 1 origin "$WHISPER_CPP_COMMIT"
          git -C "$whisper_dir" checkout --detach FETCH_HEAD
          git -C "$whisper_dir" submodule update --init --recursive --depth 1
          echo "AI_VIDEO_WHISPER_CPP_SOURCE_DIR=$whisper_dir" >> "$GITHUB_ENV"
          echo "Using whisper.cpp commit: $(git -C "$whisper_dir" rev-parse HEAD)"

      - name: Validate bundle identifier
        env:
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
        run: |
          if [[ ! "$BUNDLE_IDENTIFIER" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "Bundle Identifier 格式无效: $BUNDLE_IDENTIFIER"
            exit 1
          fi

      - name: Apply bundle identifier for this build
        env:
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
        run: |
          project_file="ios/Runner.xcodeproj/project.pbxproj"
          default_identifier="com.example.aiVideoPlayerNext"

          test "$(grep -F -c "PRODUCT_BUNDLE_IDENTIFIER = $default_identifier;" "$project_file")" -eq 3
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = $default_identifier;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_IDENTIFIER;|g" "$project_file"
          test "$(grep -F -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_IDENTIFIER;" "$project_file")" -eq 3

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Cache iOS Flutter engine
        run: flutter precache --ios

      - name: Install iOS native dependencies
        run: pod install --project-directory=ios

      - name: Verify native speech_core inputs
        run: |
          test -f "$AI_VIDEO_WHISPER_CPP_SOURCE_DIR/CMakeLists.txt"
          test -f "../native/speech_core/ios/build_speech_core_ios.sh"

      - name: Set build identity
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"
          app_build_time="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          app_build_id="$(date '+%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_BUILD_TIME=$app_build_time" >> "$GITHUB_ENV"
          echo "APP_BUILD_ID=$app_build_id" >> "$GITHUB_ENV"

          echo "应用版本：$app_version"
          echo "构建时间：$app_build_time"
          echo "构建编号：$app_build_id"

      - name: Build unsigned iOS application
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_TIME="$APP_BUILD_TIME" \
            --dart-define=APP_BUILD_ID="$APP_BUILD_ID"

      - name: Verify bundled player framework
        run: |
          framework_path="build/ios/iphoneos/Runner.app/Frameworks/Mpv.framework"
          test -d "$framework_path"
          test -f "$framework_path/Mpv"
          file "$framework_path/Mpv"

      - name: Verify the build carries no Whisper weight
        run: |
          # Weights are installed by the user from settings. A build that
          # smuggles one back in would silently undo the size reduction and
          # ship a model the user did not choose.
          app_path="build/ios/iphoneos/Runner.app"
          ! find "$app_path" -name '*.bin' -size +100M | grep .
          echo "No bundled Whisper weight in Runner.app"

      - name: Package unsigned IPA
        env:
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
        run: |
          app_path="build/ios/iphoneos/Runner.app"
          artifact_name="AI-Video-Player-Next-${BUNDLE_IDENTIFIER}-unsigned.ipa"
          package_root="build/unsigned-ipa"

          test -d "$app_path"
          rm -rf "$package_root"
          mkdir -p "$package_root/Payload"
          cp -R "$app_path" "$package_root/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$package_root/Payload" "build/$artifact_name"
          test -f "build/$artifact_name"

          ipa_size="$(stat -f '%z' "build/$artifact_name")"
          echo "Unsigned IPA size: $ipa_size bytes"
          # A weightless build measures about 15.6 MB. The lower bound catches
          # a build that lost its frameworks; the upper bound catches a weight
          # finding its way back into the bundle.
          test "$ipa_size" -gt 10000000
          test "$ipa_size" -lt 300000000
          ! unzip -Z1 "build/$artifact_name" | grep -E 'Payload/Runner\.app/ggml-.*\.bin'
          echo "IPA carries no Whisper weight"

          echo "IPA_PATH=app/build/$artifact_name" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa-${{ inputs.bundle_identifier }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: AI Video Player Next iOS unsigned v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Windows and iOS acceptance build.

            This IPA is intentionally unsigned. Install it only with a sideloading workflow that signs it for your device.

            - Version: `${{ env.APP_VERSION }}`
            - Build time: `${{ env.APP_BUILD_TIME }}`
            - Build id: `${{ env.APP_BUILD_ID }}`
            - Bundle identifier: `${{ inputs.bundle_identifier }}`
            - Whisper model: none bundled; install one from 设置 → 识别模型 on first run
          files: ${{ env.IPA_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: false
